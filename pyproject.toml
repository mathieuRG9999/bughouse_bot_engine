[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bughouse2v2"
version = "0.1.0"
description = "Moteur de bughouse 2v2 (horloges, undo, bots, CLI)"
requires-python = ">=3.10"
dependencies = ["chess>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bughouse = "bughouse2v2.cli:main"

[project.gui-scripts]
bughouse-gui = "bughouse2v2.gui:main"

[tool.setuptools]
packages = ["bughouse2v2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
